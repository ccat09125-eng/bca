services:
  - type: web
    name: bca-study-exam-hub
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-prod.txt
    startCommand: gunicorn server:app --bind 0.0.0.0:${PORT:-10000}
    healthCheckPath: /api/health
    envVars:
      - key: PUBLIC_DEPLOY
        value: "true"
      - key: APP_SECRET_KEY
        generateValue: true
      - key: DATA_DIR
        value: /opt/render/project/src/data
